
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#15370D">
  <title>Анна — Web Developer</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --green-dark: #15370D;
      --green-light: #728E6D;
      --gold: #E5CD82;
      --cream: #FFF2B4;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', Arial, Helvetica, sans-serif;
      background: var(--green-dark);
      color: var(--cream);
      overflow-x: hidden;
      padding-top: 78px;
    }

    a {
      color: inherit;
    }

    .hero h1,
    .section-title,
    .nav-logo,
    .footer-logo,
    .service-card h3 {
      font-family: 'Playfair Display', Georgia, serif;
    }

    /* ===== ДЕКОРАТИВНЫЙ ФОН ===== */

    .background {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(
          rgba(114, 142, 109, 0.09) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(114, 142, 109, 0.09) 1px,
          transparent 1px
        );
      background-size: 55px 55px;
      mask-image: linear-gradient(to bottom, black, transparent 90%);
    }

    .circle {
      position: absolute;
      border: 1px solid rgba(229, 205, 130, 0.18);
      border-radius: 50%;
    }

    .circle-one {
      width: 420px;
      height: 420px;
      top: 10%;
      right: -150px;
    }

    .circle-two {
      width: 280px;
      height: 280px;
      top: 20%;
      right: -80px;
    }

    .circle-three {
      width: 350px;
      height: 350px;
      bottom: -150px;
      left: -100px;
    }

    /* Дополнительные 5 кругов */

    .circle-four {
      width: 180px;
      height: 180px;
      top: 12%;
      left: 42%;
    }

    .circle-five {
      width: 300px;
      height: 300px;
      top: -50px;
      left: -100px;
    }

    .circle-six {
      width: 240px;
      height: 240px;
      bottom: -100px;
      right: 28%;
    }

    .circle-seven {
      width: 200px;
      height: 200px;
      top: 2%;
      left: -50px;
    }

    .circle-eight {
      width: 65px;
      height: 65px;
      top: 75%;
      left: 43%;
    }

    .glow {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      filter: blur(110px);
      opacity: 0.17;
    }

    .glow-one {
      background: var(--green-light);
      top: 10%;
      left: 5%;
    }

    .glow-two {
      background: #B39A50;
      right: 0;
      bottom: 0;
      opacity: 0.1;
    }

    .star {
      position: absolute;
      color: var(--gold);
      opacity: 0.7;
      font-size: 18px;
    }

    .star-one {
      top: 20%;
      left: 8%;
    }

    .star-two {
      top: 70%;
      right: 8%;
      font-size: 13px;
    }

    .star-three {
      top: 45%;
      left: 48%;
      font-size: 12px;
    }

    /* Дополнительные 5 звёзд */

    .star-four {
      top: 35%;
      right: 2%;
      font-size: 22px;
    }

    .star-five {
      top: 58%;
      left: 2%;
      font-size: 14px;
    }

    .star-six {
      bottom: 5%;
      left: 32%;
      font-size: 17px;
    }

   

    .star-eight {
      bottom: 10%;
      right: 12%;
      font-size: 15px;
    }
    

    .dot {
      position: absolute;
      width: 5px;
      height: 5px;
      background: var(--gold);
      border-radius: 50%;
      opacity: 0.55;
    }

    .dot-one {
      top: 28%;
      left: 40%;
    }

    .dot-two {
      top: 78%;
      left: 70%;
    }

    .dot-three {
      top: 14%;
      right: 25%;
    }

    /* ===== НАВИГАЦИЯ ===== */

    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      padding: 18px 7%;
      background: rgba(21, 55, 13, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(229, 205, 130, 0.35);
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .nav-logo {
      color: var(--cream);
      font-size: 25px;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }

    .nav-logo span {
      color: var(--gold);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 32px;
    }

    .nav-links a {
      color: var(--cream);
      text-decoration: none;
      font-size: 15px;
      transition: color 0.25s ease;
      white-space: nowrap;
    }

    .nav-links a:hover {
      color: var(--gold);
    }

    .menu-toggle {
      display: none;
      width: 44px;
      height: 42px;
      border: 1px solid var(--gold);
      border-radius: 12px;
      background: transparent;
      color: var(--cream);
      font-size: 23px;
      cursor: pointer;
      align-items: center;
      justify-content: center;
    }

    /* ===== ОБЩИЕ СТИЛИ ===== */

    .container {
      width: min(1120px, 86%);
      margin: 0 auto;
    }

    .section {
      padding: 100px 0;
    }

    .section-label {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--gold);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 22px;
    }

    .section-label::before {
      content: "";
      width: 28px;
      height: 1px;
      background: var(--gold);
    }

    .section-title {
      color: var(--cream);
      font-size: clamp(32px, 5vw, 48px);
      line-height: 1.15;
      margin-bottom: 24px;
      letter-spacing: -0.5px;
    }

    .section-text {
      color: rgba(255, 242, 180, 0.72);
      font-size: 16px;
      line-height: 1.9;
    }

    /* ===== ГЛАВНЫЙ ЭКРАН ===== */

    .hero {
      position: relative;
      z-index: 1;
      min-height: calc(100vh - 78px);
      display: flex;
      align-items: center;
      padding: 20px 0 40px;
    }

    .hero-content {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      align-items: center;
      gap: 70px;
    }

    .hero-text {
      max-width: 610px;
    }

    .hero h1 {
      color: var(--cream);
      font-size: clamp(45px, 6vw, 76px);
      line-height: 1.1;
      letter-spacing: -1px;
      margin-bottom: 25px;
    }

    .hero h1 span {
      display: block;
      color: var(--gold);
    }

    .hero-description {
      max-width: 500px;
      color: rgba(255, 242, 180, 0.75);
      font-size: 17px;
      line-height: 1.85;
      margin-bottom: 34px;
    }

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .btn {
      min-width: 175px;
      min-height: 52px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 22px;
      border: 1px solid transparent;
      border-radius: 14px;
      color: var(--green-dark);
      background: linear-gradient(
        135deg,
        #F3E3A0 0%,
        var(--gold) 45%,
        #B39A50 100%
      );
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
      transition: background 0.25s ease, transform 0.25s ease;
    }

    .btn:hover {
      background: linear-gradient(
        135deg,
        #FFF8D0 0%,
        var(--cream) 45%,
        var(--gold) 100%
      );
      
    }

    /* ===== ФОТОГРАФИЯ ===== */

    .hero-visual {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
    }

    .photo-frame {
      position: relative;
      width: min(100%, 420px);
      aspect-ratio: 0.78;
      border-radius: 48% 48% 45% 45%;
      padding: 10px;
      border: 1px solid rgba(229, 205, 130, 0.7);
      background: rgba(114, 142, 109, 0.15);
      box-shadow: 0 0 70px rgba(114, 142, 109, 0.12);
    }

    .photo-frame::before {
      content: "";
      position: absolute;
      inset: -17px;
      border: 1px solid rgba(229, 205, 130, 0.22);
      border-radius: 48% 48% 45% 45%;
      pointer-events: none;
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
      border-radius: inherit;
    }

    /* ===== АДАПТИВНОСТЬ ===== */

    @media (max-width: 900px) {
      .navbar {
        padding: 17px 5%;
      }

      .nav-links {
        gap: 20px;
      }

      .hero-content {
        gap: 45px;
      }

      .hero h1 {
        font-size: clamp(43px, 6vw, 62px);
      }
    }

    @media (max-width: 768px) {
      body {
        padding-top: 0;
      }

      .navbar {
        padding: 14px 5%;
      }

      .nav-logo {
        font-size: 23px;
      }

      .menu-toggle {
        display: flex;
      }

      .nav-links {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;
        padding: 22px 6%;
        background: rgba(21, 55, 13, 0.99);
        border-bottom: 1px solid rgba(229, 205, 130, 0.35);
        flex-direction: column;
        align-items: flex-start;
        gap: 22px;
      }

      .nav-links.open {
        display: flex;
      }

      .nav-links a {
        font-size: 16px;
      }

      .container {
        width: 88%;
      }

      .hero {
        min-height: auto;
        padding: 60px 0 80px;
      }

      .hero-content {
        grid-template-columns: 1fr;
        gap: 65px;
      }

      .hero-text {
        max-width: 100%;
      }

      .hero h1 {
        font-size: clamp(45px, 10vw, 68px);
      }

      .hero-description {
        font-size: 16px;
      }

      .hero-visual {
        width: 100%;
        max-width: 430px;
        margin: 0 auto;
      }

      .photo-frame {
        width: min(78%, 320px);
      }
    }

    @media (max-width: 420px) {
      .hero-buttons {
        flex-direction: column;
      }

      .hero-buttons .btn {
        width: 100%;
      }

      .hero h1 {
        font-size: 43px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>

  <!-- Декоративный фон -->
  <div class="background" aria-hidden="true">
    <div class="grid"></div>

    <!-- Первые 3 круга -->
    <div class="circle circle-one"></div>
    <div class="circle circle-two"></div>
    <div class="circle circle-three"></div>

    <!-- Дополнительные 5 кругов -->
    <div class="circle circle-four"></div>
    <div class="circle circle-five"></div>
    <div class="circle circle-six"></div>
    <div class="circle circle-seven"></div>
    <div class="circle circle-eight"></div>

    <!-- Световые пятна -->
    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>

    <!-- Первые 3 звезды -->
    <span class="star star-one">✦</span>
    <span class="star star-two">✧</span>
    <span class="star star-three">✦</span>

    <!-- Дополнительные 5 звезд -->
    <span class="star star-four">✦</span>
    <span class="star star-five">✧</span>
    <span class="star star-six">✦</span>
    <span class="star star-eight">✦</span>

    <!-- Декоративные точки -->
    <span class="dot dot-one"></span>
    <span class="dot dot-two"></span>
    <span class="dot dot-three"></span>
  </div>

  <!-- Закрепленная навигация -->
  <header class="navbar">
    <nav class="nav-container" aria-label="Главная навигация">

      <a href="javascript:void(0)" class="nav-logo" aria-label="Anna.dev">
        Anna<span>.</span>dev
      </a>

      <button
        class="menu-toggle"
        id="menuToggle"
        type="button"
        aria-label="Открыть меню"
        aria-expanded="false"
        aria-controls="navLinks"
      >
        ☰
      </button>

      <div class="nav-links" id="navLinks">
        <a href="javascript:void(0)">Главная</a>
        <a href="javascript:void(0)">Обо мне</a>
        <a href="javascript:void(0)">Услуги</a>
        <a href="javascript:void(0)">Контакты</a>
      </div>

    </nav>
  </header>

  <!-- Главный экран -->
  <main>
    <section class="hero" id="home">
      <div class="container hero-content">

        <div class="hero-text">
          <h1>
            Я Анна –
            <span>web-developer</span>
          </h1>

          <p class="hero-description">
            Разрабатываю современные и стильные сайты,
            которые помогают представить ваш проект,
            выделиться среди конкурентов и привлечь клиентов.
          </p>

          <div class="hero-buttons">
            <a href="mailto:email@example.com" class="btn">
              Обсудить проект ↗
            </a>

            <a href="javascript:void(0)" class="btn">
              Узнать обо мне
            </a>
          </div>
        </div>

        <div class="hero-visual">
          <div class="photo-frame">
            <img src="Я.jpg" alt="Фотография Анны">
          </div>
        </div>

      </div>
    </section>
  </main>

  <!-- Мобильное меню -->
  <script>
    const menuToggle = document.getElementById("menuToggle");
    const navLinks = document.getElementById("navLinks");

    menuToggle.addEventListener("click", function () {
      const isOpen = navLinks.classList.toggle("open");

      menuToggle.setAttribute("aria-expanded", String(isOpen));
      menuToggle.setAttribute(
        "aria-label",
        isOpen ? "Закрыть меню" : "Открыть меню"
      );

      menuToggle.textContent = isOpen ? "✕" : "☰";
    });

    navLinks.querySelectorAll("a").forEach(function (link) {
      link.addEventListener("click", function (event) {
        event.preventDefault();

        navLinks.classList.remove("open");
        menuToggle.setAttribute("aria-expanded", "false");
        menuToggle.setAttribute("aria-label", "Открыть меню");
        menuToggle.textContent = "☰";
      });
    });
  </script>

</body>
</html>
